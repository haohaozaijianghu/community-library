apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: book-files
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  selector:
    app: db
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: db
          image: postgres:17-alpine
          env:
            - name: POSTGRES_USER
              value: library
            - name: POSTGRES_DB
              value: library
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: library-db
                  key: password
          readinessProbe:
            exec:
              command: [pg_isready, -h, 127.0.0.1, -U, library, -d, library]
            periodSeconds: 2
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: schema
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: db-data
        - name: schema
          configMap:
            name: library-db-schema
---
apiVersion: v1
kind: Service
metadata:
  name: mock
spec:
  selector:
    app: mock
  ports:
    - port: 8091
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock
spec:
  selector:
    matchLabels:
      app: mock
  template:
    metadata:
      labels:
        app: mock
    spec:
      containers:
        - name: mock
          image: community-library-mock:local
          readinessProbe:
            tcpSocket:
              port: 8091
            periodSeconds: 2
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: library-config
data:
  LIBRARY_DEMO_TOKENS: "1"
  LIBRARY_LOCAL_PHONE_LOGIN: "0"
  LIBRARY_FILE_ROOT: /var/lib/library/files
  LIBRARY_MOCK_URL: http://mock:8091
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  progressDeadlineSeconds: 120
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: community-library-app:local
          args: [uvicorn, "library.api:app", --host, 0.0.0.0, --port, "8000"]
          envFrom:
            - configMapRef:
                name: library-config
            - secretRef:
                name: library-app
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 2
          volumeMounts:
            - name: files
              mountPath: /var/lib/library/files
      volumes:
        - name: files
          persistentVolumeClaim:
            claimName: book-files
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      initContainers:
        - name: wait-for-api
          image: community-library-app:local
          command: [python, -c, "from urllib.request import urlopen; urlopen('http://api:8000/healthz', timeout=3).close()"]
      containers:
        - name: worker
          image: community-library-app:local
          args: [python, -m, library.worker]
          envFrom:
            - configMapRef:
                name: library-config
            - secretRef:
                name: library-app
          volumeMounts:
            - name: files
              mountPath: /var/lib/library/files
      volumes:
        - name: files
          persistentVolumeClaim:
            claimName: book-files
