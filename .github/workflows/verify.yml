name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: community-library-ci
      LIBRARY_HTTP_PORT: "18080"
      LIBRARY_MOCK_PORT: "18091"
      LIBRARY_SEED_DEMO_BOOKS: "0"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install pytest
          python -m pytest -q
      - run: docker compose up -d --build --wait
      - run: python scripts/check_library.py
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes
  kubernetes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - run: |
          GOBIN="$RUNNER_TEMP/bin" go install sigs.k8s.io/kind@v0.33.0
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: bash scripts/check_kubernetes.sh
